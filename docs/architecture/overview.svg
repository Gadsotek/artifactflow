<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1030" role="img" aria-labelledby="title description">
  <title id="title">ArtifactFlow architecture map</title><desc id="description">A Laravel modular monolith with separate HTTP roles, isolated processors, PostgreSQL, and private artifact storage.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #202539; }
    .background { fill: #f8f9fc; }
    .card { fill: #fff; stroke: #dfe2ed; stroke-width: 1.5; }
    .accent-card { fill: #f0efff; stroke: #b8b0f1; stroke-width: 1.5; }
    .dark-card { fill: #20233c; }
    .title { font-size: 42px; font-weight: 700; letter-spacing: -1.5px; }
    .label { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #6254d9; }
    .heading { font-size: 23px; font-weight: 650; letter-spacing: -.5px; }
    .body { font-size: 17px; fill: #555e74; }
    .small { font-size: 14px; fill: #606982; }
    .light { fill: #f7f7ff; }
    .muted-light { fill: #c8c9e5; }
    .rule { stroke: #dfe2ed; stroke-width: 1; }
    .line { fill: none; stroke: #8c80e9; stroke-width: 2; marker-end: url(#arrow); }
    .dot { fill: #7969e8; }
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 1 L6 4 L0 7" fill="none" stroke="#8c80e9" stroke-width="1.4"/></marker></defs>
  <rect class="background" width="1200" height="1030"/>
  <text class="label" x="48" y="53">ARTIFACTFLOW / SYSTEM MAP</text>
  <text class="title" x="48" y="110">A small core. Deliberate isolation.</text>
  <text class="body" x="48" y="149">Laravel 13 · PHP 8.5 · PostgreSQL · Caddy / FrankenPHP</text>
  <rect class="card" x="48" y="196" width="536" height="140" rx="18"/>
  <text class="heading" x="72" y="235">App runtime</text>
  <text class="body" x="72" y="267">Web interface, sessions, search, and scoped MCP</text>
  <text class="body" x="72" y="293">Thin controllers and protocol adapters</text>
  <rect class="accent-card" x="616" y="196" width="536" height="140" rx="18"/>
  <text class="heading" x="640" y="235">Artifact-host runtime</text>
  <text class="body" x="640" y="267">Cookieless presentation on a separate hostname</text>
  <text class="body" x="640" y="293">Restricted database grants and private storage</text>
  <text class="label" x="48" y="391">APPLICATION / THE RULES LIVE HERE</text>
  <rect class="card" x="48" y="415" width="344" height="150" rx="18"/>
  <text class="heading" x="72" y="454">Identity</text>
  <text class="body" x="72" y="486">Accounts, 2FA, invitations</text>
  <text class="body" x="72" y="512">Workspace hierarchy and roles</text>
  <text class="body" x="72" y="538">Personal and shared workspaces</text>
  <rect class="accent-card" x="428" y="415" width="344" height="150" rx="18"/>
  <text class="heading" x="452" y="454">Page catalog</text>
  <text class="body" x="452" y="486">Content, versions, grants, and search</text>
  <text class="body" x="452" y="512">Preview capabilities and lifecycle</text>
  <text class="body" x="452" y="538">Format validation and storage</text>
  <rect class="card" x="808" y="415" width="344" height="150" rx="18"/>
  <text class="heading" x="832" y="454">MCP and provenance</text>
  <text class="body" x="832" y="486">Token scope and Editor ceiling</text>
  <text class="body" x="832" y="512">Observed ingests, declared producers</text>
  <text class="body" x="832" y="538">Lineage and untrusted-data reads</text>
<rect class="dark-card" x="48" y="589" width="1104" height="93" rx="18"/>
  <text class="heading light" x="72" y="624">State changes + search + audit + event journal commit together.</text>
  <text class="body muted-light" x="72" y="655">PostgreSQL is the source of truth. The outbox dispatches after commit; current listeners are observational.</text>
  <text class="label" x="48" y="739">INFRASTRUCTURE / EACH ROLE HAS A JOB</text>
  <rect class="card" x="48" y="763" width="344" height="150" rx="18"/>
  <text class="heading" x="72" y="802">Data</text>
  <text class="body" x="72" y="834">PostgreSQL: state, search, mail queue</text>
  <text class="body" x="72" y="860">Private artifacts: source and originals</text>
  <text class="body" x="72" y="886">Derivatives belong to their version</text>
  <rect class="card" x="428" y="763" width="344" height="150" rx="18"/>
  <text class="heading" x="452" y="802">Background roles</text>
  <text class="body" x="452" y="834">Worker: outbound mail</text>
  <text class="body" x="452" y="860">Scheduler: dispatch and retention</text>
  <text class="body" x="452" y="886">Reverb: optional presence / notices</text>
  <rect class="accent-card" x="808" y="763" width="344" height="150" rx="18"/>
  <text class="heading" x="832" y="802">Isolated processors</text>
  <text class="body" x="832" y="834">PNG/JPEG, PDF, XLSX, DOCX</text>
  <text class="body" x="832" y="860">Dedicated images, secrets, and limits</text>
  <text class="body" x="832" y="886">PDF/XLSX/DOCX default-off</text>
  <text class="small" x="48" y="958">Code map: app/Http and app/Mcp → app/Application → Eloquent and private storage.</text>
  <text class="small" x="48" y="984">app/Domain holds enums/exceptions. docs/ARCHITECTURE.md explains the contracts and links to the code.</text>
</svg>
