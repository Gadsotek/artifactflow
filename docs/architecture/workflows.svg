<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1110" role="img" aria-labelledby="title description">
  <title id="title">ArtifactFlow: design and workflows</title><desc id="description">How work is retained, authorized, and presented across separate app, artifact, and processor boundaries.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #202539; }
    .background { fill: #f8f9fc; }
    .card { fill: #fff; stroke: #dfe2ed; stroke-width: 1.5; }
    .accent-card { fill: #f0efff; stroke: #b8b0f1; stroke-width: 1.5; }
    .dark-card { fill: #20233c; }
    .title { font-size: 42px; font-weight: 700; letter-spacing: -1.5px; }
    .label { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #6254d9; }
    .heading { font-size: 23px; font-weight: 650; letter-spacing: -.5px; }
    .body { font-size: 17px; fill: #555e74; }
    .small { font-size: 14px; fill: #606982; }
    .light { fill: #f7f7ff; }
    .muted-light { fill: #c8c9e5; }
    .rule { stroke: #dfe2ed; stroke-width: 1; }
    .line { fill: none; stroke: #8c80e9; stroke-width: 2; marker-end: url(#arrow); }
    .dot { fill: #7969e8; }
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 1 L6 4 L0 7" fill="none" stroke="#8c80e9" stroke-width="1.4"/></marker></defs>
  <rect class="background" width="1200" height="1110"/>
  <text class="label" x="48" y="53">ARTIFACTFLOW / HOW WORK MOVES</text>
  <text class="title" x="48" y="110">One artifact. Clear boundaries.</text>
  <text class="body" x="48" y="149">People and scoped MCP clients use the same library and server-side rules.</text>
  <text class="label" x="48" y="215">01 / KEEP THE WORK</text>
  <rect class="card" x="48" y="238" width="344" height="148" rx="18"/>
  <text class="heading" x="72" y="277">Authorize the write</text>
  <text class="body" x="72" y="309">Web or MCP request</text>
  <text class="body" x="72" y="335">Scope, permission, size, fresh revision</text>
  <rect class="card" x="428" y="238" width="344" height="148" rx="18"/>
  <text class="heading" x="452" y="277">Prepare the content</text>
  <text class="body" x="452" y="309">Scan or isolate binary processing</text>
  <text class="body" x="452" y="335">Validate the result; stage private bytes</text>
  <rect class="accent-card" x="808" y="238" width="344" height="148" rx="18"/>
  <text class="heading" x="832" y="277">Commit together</text>
  <text class="body" x="832" y="309">Recheck under locks</text>
  <text class="body" x="832" y="335">Version + search + quota + audit</text>
<path class="line" d="M392 312 H420"/><path class="line" d="M772 312 H800"/>
  <text class="small" x="48" y="418">Restore appends a version. Metadata has its own revision. Retention bounds saved history.</text>
  <text class="label" x="48" y="493">02 / PRESENT THE WORK</text>
  <rect class="card" x="48" y="518" width="475" height="195" rx="18"/>
  <text class="heading" x="72" y="557">App origin</text>
  <text class="body" x="72" y="589">Your login, permissions, and workspace</text>
  <text class="body" x="72" y="615">Authorize a saved version or bind exact draft bytes</text>
  <text class="body" x="72" y="641">Issue a short-lived capability</text>
  <text class="body" x="72" y="667">Keep the authenticated document in place</text>
  <rect class="accent-card" x="677" y="518" width="475" height="195" rx="18"/>
  <text class="heading" x="701" y="557">Artifact origin</text>
  <text class="body" x="701" y="589">Verify capability and live state</text>
  <text class="body" x="701" y="615">Serve only the allowed presentation</text>
  <text class="body" x="701" y="641">Separate hostname; no app cookies</text>
  <text class="body" x="701" y="667">Private storage and restricted database role</text>
<path class="line" d="M533 614 H667"/>
  <text class="small" x="552" y="594">≤ 60 sec</text>
  <text class="small" x="48" y="747">HTML: opaque sandbox + header CSP + early guard. Images: scriptless. XLSX: typed local grid.</text>
  <text class="small" x="48" y="773">PDF and DOCX-PDF: native viewing, download-equivalent, with the documented PDF-only sandbox exception.</text>
  <text class="label" x="48" y="835">03 / KEEP PROCESSORS SEPARATE</text>
  <rect class="card" x="48" y="858" width="344" height="138" rx="18"/>
  <text class="heading" x="72" y="897">Images and PDF</text>
  <text class="body" x="72" y="929">PNG/JPEG normalization</text>
  <text class="body" x="72" y="955">PDF validation and native text</text>
  <rect class="card" x="428" y="858" width="344" height="138" rx="18"/>
  <text class="heading" x="452" y="897">Office documents</text>
  <text class="body" x="452" y="929">XLSX → typed manifest</text>
  <text class="body" x="452" y="955">DOCX → LibreOffice → PDFBox</text>
  <rect class="accent-card" x="808" y="858" width="344" height="138" rx="18"/>
  <text class="heading" x="832" y="897">Dedicated containment</text>
  <text class="body" x="832" y="929">One worker, bounded resources</text>
  <text class="body" x="832" y="955">No app data or storage credentials</text>
  <text class="small" x="48" y="1040">Residuals remain: HTML self-navigation, browser-dependent WebRTC, parser flaws, and already-delivered bytes.</text>
  <text class="small" x="48" y="1066">Read THREAT-MODEL.md and the format decisions for the complete contracts.</text>
</svg>
