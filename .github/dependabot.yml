version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: cron
      cronjob: '15 1 * * *'
      timezone: Etc/UTC
    groups:
      composer-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: '30 1 * * *'
      timezone: Etc/UTC
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /scripts/mcp-remote-bridge
    schedule:
      interval: cron
      cronjob: '45 1 * * *'
      timezone: Etc/UTC

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
